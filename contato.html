<section class="contato" id="contato">

    <h2>
        Entre em Contato
    </h2>

    <form id="formContato">

        <input
        type="text"
        id="nome"
        placeholder="Seu nome">

        <input
        type="email"
        id="email"
        placeholder="Seu email">

        <textarea
        id="mensagem"
        placeholder="Sua mensagem">
        </textarea>

        <button
        type="submit"
        class="btn-yellow">

            Enviar Mensagem

        </button>

    </form>

</section>
